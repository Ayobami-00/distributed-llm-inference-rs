[package]
name = "candle-transformers"
version = "0.11.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Slim Candle 0.11.0 Llama test oracle for dlir"
publish = false

[features]
default = []
flash-attn = []

[lib]
name = "candle_transformers"
path = "src/lib.rs"

[dependencies]
candle = { package = "candle-core", version = "0.11.0" }
candle-nn = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
